<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#17131d"><title>Cantinho da Mio</title>
<style>
:root{color-scheme:dark;--bg:#17131d;--panel:#29212d;--cream:#f1e4d5;--rose:#c98d91;--gold:#e6c68c}*{box-sizing:border-box}body{margin:0;padding:env(safe-area-inset-top) 12px env(safe-area-inset-bottom);background:var(--bg);color:var(--cream);font:15px/1.5 Georgia,serif}button{min-height:44px;padding:9px 12px;color:inherit;background:#382d38;border:1px solid #9c7c78;border-radius:10px;font:inherit;touch-action:manipulation}button:focus-visible{outline:3px solid var(--gold);outline-offset:3px}button:active{background:#57414d}.app{width:min(100%,1040px);margin:auto;padding:12px 0 24px}.top{display:flex;justify-content:space-between;margin-bottom:12px;gap:8px}.brand{font:600 13px system-ui;letter-spacing:.2em;color:#e8c7b7}.sub{font:12px system-ui;color:#bba9a2}.layout{display:grid;grid-template-columns:minmax(0,1fr) 245px;gap:14px}.frame{padding:9px;background:linear-gradient(145deg,#59414b,#211b28);border:1px solid #96777a;border-radius:16px;box-shadow:0 18px 55px #09070baa}.scene{position:relative;overflow:hidden;aspect-ratio:4/3;border-radius:9px;background:linear-gradient(#55566c 0 44%,#80616a 44% 46%,#755a5e 46%)}.wall{position:absolute;inset:0 0 55%;background:radial-gradient(ellipse at 50% 5%,#aaa0a4,#656276 55%,#45445b)}.wall:after{content:"";position:absolute;inset:0;background:repeating-linear-gradient(90deg,transparent 0 74px,#ffffff0b 75px 77px),repeating-linear-gradient(0deg,transparent 0 53px,#ffffff0a 54px 56px)}.floor{position:absolute;inset:45% 0 0;background:repeating-linear-gradient(0deg,#6b5054 0 4px,#795c60 5px 7px),repeating-linear-gradient(90deg,transparent 0 112px,#382d38 113px 115px)}.rug{position:absolute;left:20%;bottom:4%;width:60%;height:28%;border:8px solid #d0a6a0;border-radius:50%;background:linear-gradient(135deg,#b78a87,#80616d);box-shadow:inset 0 0 0 2px #684d5b}.window{position:absolute;left:8%;top:8%;width:23%;height:34%;border:9px solid #60464c;background:linear-gradient(135deg,#293c56,#7893a7 55%,#d2b6a8);box-shadow:inset 0 0 0 4px #d7b6a1}.window:before,.window:after{content:"";position:absolute;background:#d7b6a1}.window:before{width:4px;top:0;bottom:0;left:50%}.window:after{height:4px;left:0;right:0;top:50%}.dresser{position:absolute;right:7%;top:13%;width:23%;height:34%;background:linear-gradient(90deg,#583e3c,#98705d 50%,#60433f);border:5px solid #483439;border-radius:5px;box-shadow:0 9px 12px #20151c88}.dresser:before{content:"";position:absolute;left:7%;right:7%;top:10%;height:34%;background:#b68b72;border:3px solid #513a3c;box-shadow:0 48px 0 -3px #b68b72,0 48px 0 0 #513a3c}.dresser:after{content:"";position:absolute;left:47%;top:24%;width:8px;height:8px;border-radius:50%;background:#e7c58e;box-shadow:0 48px #e7c58e}.bed{position:absolute;right:7%;bottom:10%;width:43%;height:35%;background:linear-gradient(150deg,#d8c1bb,#9c7881);border:7px solid #5a4149;border-radius:12px 12px 5px 5px;box-shadow:0 10px 18px #24182099}.bed:before{content:"";position:absolute;left:5%;top:7%;width:38%;height:34%;background:#f0ded2;border-radius:8px;box-shadow:90px 0 0 -2px #e9d7cf}.bed:after{content:"";position:absolute;left:0;right:0;bottom:0;height:37%;background:linear-gradient(90deg,#80616d,#a77e87,#765764)}.shelf{position:absolute;left:6%;bottom:15%;width:21%;height:29%;background:#563c3d;border:5px solid #3d2d34;box-shadow:inset 0 0 0 3px #9a705c}.shelf:before{content:"";position:absolute;left:0;right:0;top:47%;height:7px;background:#bd9675;box-shadow:0 -42px #bd9675}.shelf:after{content:"";position:absolute;left:10%;top:8%;width:13%;height:35%;background:#c58b83;box-shadow:17px 4px #d9b68a,34px 0 #71869a,51px 5px #b47b76}.desk{position:absolute;left:34%;bottom:22%;width:25%;height:17%;background:linear-gradient(#9d735f 0 22%,#694a43 23%);border:4px solid #543b3a;box-shadow:0 8px #3e2e34}.desk:after{content:"";position:absolute;left:12%;right:12%;bottom:-25px;height:25px;border-left:5px solid #49343a;border-right:5px solid #49343a}.hot{position:absolute;z-index:3;min-width:48px;min-height:44px;padding:4px 7px;border:1px solid #f3d8bd99;background:#201a2677;border-radius:10px;color:#fff4e8;font:11px system-ui;backdrop-filter:blur(3px)}.hot:after{content:"";display:block;margin:2px auto;width:7px;height:7px;border-radius:50%;background:#f2d29b;box-shadow:0 0 12px #f2d29b}.hot[data-o=window]{left:11%;top:20%}.hot[data-o=dresser]{right:10%;top:27%}.hot[data-o=bed]{right:19%;bottom:16%}.hot[data-o=shelf]{left:8%;bottom:22%}.hot[data-o=desk]{left:36%;bottom:28%}.hot[data-o=notebook]{left:43%;bottom:35%}.hot[data-o=radio]{left:54%;bottom:40%}.side{display:grid;gap:12px}.card{padding:13px;border:1px solid #745a60;border-radius:13px;background:linear-gradient(145deg,#302632,#211b27)}h2{margin:0 0 10px;color:#e4c0ae;font:600 12px system-ui;letter-spacing:.15em}.inventory{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}.item{display:grid;place-items:center;min-height:62px;background:#1c1823;border-color:#705660;font:12px system-ui}.item[aria-pressed=true]{border:2px solid var(--gold);background:#4b3540}.symbol{font-size:23px;color:#f0d0a6}.empty,.status{font:12px system-ui;color:#bba9a2}.empty{text-align:center;padding:12px}.status{min-height:34px}.progress{height:5px;background:#15121b;border-radius:8px;overflow:hidden;margin-top:8px}.progress span{display:block;height:100%;width:0;background:linear-gradient(90deg,#b47b87,#e6c68c)}.actions{display:grid;grid-template-columns:1fr 1fr;gap:7px}.actions button{font:12px system-ui}.panel{position:fixed;z-index:20;inset:0;display:grid;place-items:center;padding:14px;background:#100c16ed}.panel[hidden]{display:none}.window{width:min(100%,620px);max-height:90svh;overflow:auto;padding:16px;border:1px solid #a98b85;border-radius:16px;background:#2a222d;box-shadow:0 20px 60px #0009}.head{display:flex;align-items:center;gap:10px;margin-bottom:12px}.head h2{margin:0 auto 0 0}.close{font-size:20px;min-width:42px}.poem-tabs,.tracks{display:flex;gap:7px;flex-wrap:wrap;margin:10px 0}.poem-tabs button,.tracks button{font:12px system-ui}.poem-page{white-space:pre-wrap;line-height:1.85;font:16px/1.85 Georgia,serif;background:#211b26;padding:17px;border-radius:10px;max-height:58svh;overflow:auto}.poem-page h3{font:600 15px system-ui;color:#edc9b4;margin:0 0 12px}.tracks{display:grid}.tracks button{text-align:left}.tracks button[aria-pressed=true]{border-color:var(--gold);background:#59404a}.radio-row{display:flex;justify-content:space-between;background:#1d1a23;padding:12px;border-radius:10px;font:13px system-ui}.radio-controls{display:flex;gap:8px;margin-top:10px}.radio-controls button{flex:1}.object-art{height:150px;border-radius:10px;background:linear-gradient(145deg,#7e5e68,#3c3448);display:grid;place-items:center;font-size:76px}
@media(max-width:720px){.layout{grid-template-columns:1fr}.side{grid-template-columns:1fr 1fr}.wide{grid-column:1/-1}.frame{padding:6px}.top{margin-bottom:8px}.sub{max-width:45%;text-align:right}}@media(max-width:430px){body{padding-left:8px;padding-right:8px}.side{grid-template-columns:1fr}.wide{grid-column:auto}.card{padding:11px}.hot{min-width:40px;font-size:10px;padding:3px 5px}}
</style></head><body><main class="app"><header class="top"><div class="brand">✦ CANTINHO DA MIO</div><div class="sub">um quarto, alguns enigmas e seis canções</div></header><div class="layout"><section class="frame"><div class="scene" aria-label="Quarto interativo"><div class="wall"></div><div class="floor"></div><div class="rug"></div><div class="window"></div><div class="dresser"></div><div class="bed"></div><div class="shelf"></div><div class="desk"></div>
<button class="hot" data-o="window">Janela</button><button class="hot" data-o="dresser">Cômoda</button><button class="hot" data-o="bed">Cama</button><button class="hot" data-o="shelf">Estante</button><button class="hot" data-o="desk">Mesa</button><button class="hot" data-o="notebook">Caderno</button><button class="hot" data-o="radio">Rádio</button></div></section><aside class="side"><section class="card"><h2>INVENTÁRIO</h2><div class="inventory" id="inventory"><div class="empty">Vazio</div></div></section><section class="card"><h2>PROGRESSO</h2><div class="status" id="status" aria-live="polite">Selecione um objeto para investigar.</div><div class="progress"><span id="progress"></span></div></section><section class="card wide"><h2>JOGO</h2><div class="actions"><button id="hint">Dica</button><button id="notebookButton">Caderno</button><button id="radioButton">Rádio</button><button id="reset">Reiniciar</button></div></section></aside></div></main><div id="ytPlayer" style="position:fixed;left:-1000px;top:0;width:1px;height:1px;overflow:hidden"></div>
<section class="panel" id="poemsPanel" hidden role="dialog" aria-modal="true"><div class="window"><div class="head"><h2>CADERNO</h2><button class="close" data-close>×</button></div><div class="poem-tabs" id="poemTabs"></div><article class="poem-page" id="poemPage"></article></div></section>
<section class="panel" id="radioPanel" hidden role="dialog" aria-modal="true"><div class="window"><div class="head"><h2>RÁDIO</h2><button class="close" data-close>×</button></div><div class="radio-row"><span id="radioTitle">Final Duet — OMORI</span><span id="radioLed">●</span></div><div class="radio-controls"><button id="prevTrack">Anterior</button><button id="playPause">Reproduzir</button><button id="nextTrack">Próxima</button></div><div class="tracks" id="trackList"></div><p><a id="youtubeLink" href="https://www.youtube.com/results?search_query=Final+Duet+OMORI" target="_blank" rel="noopener noreferrer">Abrir no YouTube ↗</a></p></div></section>
<section class="panel" id="objectPanel" hidden role="dialog" aria-modal="true"><div class="window"><div class="head"><h2 id="objectTitle">OBJETO</h2><button class="close" data-close>×</button></div><div class="object-art" id="objectArt">✧</div><p id="objectDescription"></p><div class="actions"><button id="objectAction">Investigar</button><button data-close>Voltar</button></div></div></section>
<script>
"use strict";const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];
const tracks=[{title:"Final Duet — OMORI",id:"8ya9EhvcNsA"},{title:"Blue Hair — TV Girl",id:"abW7Cr9Vo_M"},{title:"Great Fairy Fountain — Zelda",id:"N_2euThPYO4"},{title:"Stairway to Heaven — Led Zeppelin",id:"Ly6ZhQVnVow"},{title:"Cotidiano — Chico Buarque",id:"dHYOVuq_Fco"},{title:"Heart to Heart — Mac DeMarco",id:"qBoQzo98EpQ"}];
const poems=[{title:"A morte do vazio",file:"morte-do-vazio.txt"},{title:"O tempo / Grazie, tempo",file:"o-tempo.txt"},{title:"Eu sou o monstro que devora",file:"monstro-que-devora.txt"},{title:"O Azul Que Restou em Mim",key:"4"},{title:"O Que Fica de Nós",key:"5"},{title:"A Distância Que Nos Faz Perto",key:"6"},{title:"Coração a Coração",key:"7"}];
const defs={window:["Janela","☾","A luz atravessa o vidro. Há algo escondido no parapeito."],dresser:["Cômoda","🗄️","Uma gaveta está trancada. Talvez uma chave sirva."],bed:["Cama","🛏️","Entre as dobras do cobertor, alguma coisa brilha."],shelf:["Estante","📚","Um livro está fora do lugar."],desk:["Escrivaninha","✉️","Há papéis e objetos sobre a mesa."],notebook:["Caderno","📖","As páginas guardam os poemas encontrados."],radio:["Rádio","♫","O rádio está pronto para tocar."]};
const itemInfo={key:["Chave","🗝"],note:["Bilhete","✉"],cassette:["Fita","▰"],flower:["Flor","✿"]};let poemData={},items=[],selected=null,unlocked=new Set(),flags=new Set(),active=null,yt=null,ytReady=false,trackIndex=0,playing=false,pending=false;
function say(s){$("#status").textContent=s}function close(){ $$(".panel").forEach(p=>p.hidden=true);active=null}function show(id){$("#"+id).hidden=false}
function inventory(){const el=$("#inventory");el.replaceChildren();if(!items.length){el.innerHTML='<div class="empty">Vazio</div>';return}items.forEach(id=>{const b=document.createElement("button");b.className="item";b.setAttribute("aria-pressed",String(selected===id));const a=document.createElement("span"),n=document.createElement("span");a.className="symbol";a.textContent=itemInfo[id][1];n.textContent=itemInfo[id][0];b.append(a,n);b.onclick=()=>{selected=selected===id?null:id;inventory();say(selected?"Selecionado: "+itemInfo[id][0]+". Toque em um objeto.":"Seleção cancelada.")};el.append(b)})}
function add(id){if(!items.includes(id)){items.push(id);inventory();say("Item encontrado: "+itemInfo[id][0]+".")}}function take(id){items=items.filter(x=>x!==id);if(selected===id)selected=null;inventory()}
function unlock(n){if(!unlocked.has(n)){unlocked.add(n);$("#progress").style.width=(unlocked.size/7*100)+"%";say("Página "+n+" desbloqueada.")}}
function inspect(id){if(id==="window"){if(!flags.has(id)){flags.add(id);add("flower")}else say("A luz muda lentamente sobre o quarto.")}
if(id==="bed"){if(!flags.has(id)){flags.add(id);add("key")}else if(selected==="flower"){take("flower");unlock(2)}else say("O cobertor está cuidadosamente dobrado.")}
if(id==="dresser"){if(selected==="key"&&!flags.has("drawer")){take("key");flags.add("drawer");add("cassette");unlock(1);say("A gaveta abriu. Você encontrou uma fita.")}else say(flags.has("drawer")?"A gaveta está aberta.":"A gaveta está trancada.")}
if(id==="shelf"){if(!flags.has(id)){flags.add(id);add("note");unlock(4)}else if(selected==="note"){take("note");unlock(5)}else say("Os livros escondem marcas na madeira.")}
if(id==="desk"){if(selected==="note"){take("note");unlock(5);unlock(6)}else if(!flags.has(id)){flags.add(id);add("note")}else say("Só restam marcas de tinta sobre a mesa.")}
if(id==="notebook"){renderPoems();show("poemsPanel")}if(id==="radio"){renderTracks();show("radioPanel");if(items.includes("cassette")){unlock(3);unlock(7)}}inventory()}
function object(id){active=id;const d=defs[id];$("#objectTitle").textContent=d[0].toUpperCase();$("#objectArt").textContent=d[1];$("#objectDescription").textContent=d[2];$("#objectAction").textContent=id==="radio"?"Abrir rádio":id==="notebook"?"Abrir caderno":"Investigar";show("objectPanel")}
function action(){const id=active;if(!id)return;close();inspect(id)}
$$("[data-o]").forEach(b=>b.onclick=()=>object(b.dataset.o));$("#objectAction").onclick=action;
function renderPoems(){const el=$("#poemTabs");el.replaceChildren();poems.forEach((p,i)=>{const b=document.createElement("button");b.textContent=unlocked.has(i+1)?String(i+1):"·";b.disabled=!unlocked.has(i+1);b.onclick=()=>showPoem(i+1);el.append(b)});showPoem([...unlocked].sort((a,b)=>b-a)[0]||1)}
async function showPoem(n){const p=poems[n-1],el=$("#poemPage");el.replaceChildren();const h=document.createElement("h3");h.textContent=p.title;el.append(h);if(!unlocked.has(n)){el.append("Página ainda não encontrada.");return}let t="";if(p.file){try{const r=await fetch("content/poems/"+p.file);if(r.ok)t=(await r.text()).trim()}catch{}}else t=poemData[p.key]?.text||"";el.append(document.createTextNode(t||"[texto original a inserir]"))}
function renderTracks(){const el=$("#trackList");el.replaceChildren();tracks.forEach((t,i)=>{const b=document.createElement("button");b.textContent=t.title;b.setAttribute("aria-pressed",String(i===trackIndex));b.onclick=()=>selectTrack(i,true);el.append(b)});radioState()}
function radioState(){const t=tracks[trackIndex];$("#radioTitle").textContent=t.title;$("#youtubeLink").href="https://www.youtube.com/watch?v="+t.id;$("#radioLed").textContent=playing?"● PLAY":"●";$("#playPause").textContent=playing?"Pausar":"Reproduzir"}
function selectTrack(i,play){trackIndex=(i+tracks.length)%tracks.length;renderTracks();if(ytReady){if(play){yt.unMute();yt.loadVideoById(tracks[trackIndex].id)}else yt.cueVideoById(tracks[trackIndex].id)}}
function onYouTubeIframeAPIReady(){yt=new YT.Player("ytPlayer",{width:"1",height:"1",videoId:tracks[0].id,playerVars:{playsinline:1,controls:0,rel:0},events:{onReady:()=>{ytReady=true;yt.setVolume(35);yt.mute();if(pending)playMusic()},onStateChange:e=>{playing=e.data===YT.PlayerState.PLAYING;radioState();if(e.data===YT.PlayerState.ENDED)selectTrack(trackIndex+1,true)},onError:()=>{playing=false;radioState();say("Esta faixa não pôde tocar aqui. Abra pelo YouTube.")}}})}
window.onYouTubeIframeAPIReady=onYouTubeIframeAPIReady;const api=document.createElement("script");api.src="https://www.youtube.com/iframe_api";document.head.append(api);
function playMusic(){if(!ytReady){pending=true;return}pending=false;yt.unMute();yt.setVolume(35);yt.loadVideoById(tracks[trackIndex].id)}
$("#playPause").onclick=()=>{if(!ytReady){pending=true;return}if(playing)yt.pauseVideo();else playMusic()};$("#prevTrack").onclick=()=>selectTrack(trackIndex-1,true);$("#nextTrack").onclick=()=>selectTrack(trackIndex+1,true);
$("#hint").onclick=()=>{const n=[1,2,3,4,5,6,7].find(x=>!unlocked.has(x));const h={1:"Procure algo sob o cobertor e experimente na cômoda.",2:"Combine a flor com a cama.",3:"Continue examinando os objetos do quarto.",4:"Investigue a estante.",5:"Use o bilhete em outro objeto.",6:"Experimente o bilhete na escrivaninha.",7:"Encontre a fita e visite o rádio."};say(h[n]||"Todas as páginas disponíveis foram encontradas.")};
$("#notebookButton").onclick=()=>{renderPoems();show("poemsPanel")};$("#radioButton").onclick=()=>{renderTracks();show("radioPanel")};$("#reset").onclick=()=>{items=[];selected=null;unlocked.clear();flags.clear();inventory();$("#progress").style.width="0";say("O quarto foi reiniciado.");close()};
$$("[data-close]").forEach(b=>b.onclick=close);$$(".panel").forEach(p=>p.addEventListener("click",e=>{if(e.target===p)close()}));
fetch("content/poems/poems.json").then(r=>r.ok?r.json():{}).then(d=>poemData=d).catch(()=>{});inventory();renderTracks();
</script></body></html>
