<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#070a14"><title>Cantinho da Mio</title>
<style>
:root{color-scheme:dark;--ink:#070a14;--panel:#111a2d;--edge:#7186ad;--silver:#dbe6f5;--blue:#9bcfff}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:var(--ink);color:var(--silver);font:14px/1.4 system-ui,sans-serif}
body{padding:env(safe-area-inset-top) 8px env(safe-area-inset-bottom)}button{font:inherit;min-height:44px;min-width:44px;padding:8px 10px;color:var(--silver);background:#17243d;border:2px solid var(--edge);border-radius:0;touch-action:manipulation}
button:focus-visible,a:focus-visible{outline:3px solid #fff0a6;outline-offset:2px}button:active{background:#2c4267}
.app{width:min(100%,820px);margin:auto;padding:5px 0 12px}.top{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:0 0 7px;font:12px monospace;letter-spacing:.08em}.top strong{color:#c6ddfb}.stage{display:grid;grid-template-columns:minmax(0,1fr) 68px;gap:6px;align-items:stretch}
.canvas-wrap{min-width:0;display:grid;place-items:center;background:#05070d;border:3px solid #53688e;overflow:hidden}
#game{display:block;width:100%;height:auto;aspect-ratio:4/3;image-rendering:pixelated;image-rendering:crisp-edges;touch-action:none;max-height:calc(100svh - 150px);object-fit:contain}
.inventory{display:grid;grid-template-rows:32px repeat(4,minmax(44px,1fr)) 32px;gap:5px;min-width:0}.inventory button{padding:0;min-width:0;min-height:32px}.slot{position:relative;display:grid;place-items:center;background:#0d1425;border:2px solid #405578}.slot[aria-pressed=true]{outline:2px solid #f0dba2;outline-offset:-4px}.slot img{width:32px;height:32px;image-rendering:pixelated}.slot span{position:absolute;right:2px;bottom:0;font:9px monospace;color:#d8e5f7}
.bottom{display:flex;justify-content:space-between;gap:5px;margin-top:7px}.bottom button{flex:1;min-width:0;padding:7px 3px;font:12px monospace}.bottom button[aria-pressed=true]{border-color:#d7e8ff;background:#2a4264}
.dpad{display:grid;grid-template-columns:repeat(3,44px);grid-template-rows:repeat(2,38px);gap:3px;justify-content:center;margin:8px auto 0}.dpad button{min-height:36px;padding:0;font-size:17px}.dpad .up{grid-column:2}.dpad .left{grid-column:1;grid-row:2}.dpad .down{grid-column:2;grid-row:2}.dpad .right{grid-column:3;grid-row:2}
.panel{position:fixed;z-index:10;inset:0;display:flex;align-items:center;justify-content:center;padding:12px;background:#03050beF;overscroll-behavior:contain}.panel[hidden]{display:none}.window{width:min(100%,560px);max-height:92svh;overflow:auto;background:#101a2d;border:3px solid #738ab1;box-shadow:0 0 0 3px #04060c;padding:12px;scrollbar-color:#526b92 #101a2d}.head{display:flex;align-items:center;justify-content:flex-end;gap:8px;margin-bottom:8px}.head h2{margin:0 auto 0 0;font:13px monospace;letter-spacing:.08em;color:#c7ddfa}.x{font-size:18px}.poem-tabs{display:flex;gap:5px;overflow-x:auto;padding:4px 0 10px}.poem-tabs button{flex:0 0 42px;padding:3px}.poem-page{background:#0a1120;border:2px solid #405578;padding:12px;white-space:pre-wrap;overflow:auto;max-height:66svh;line-height:1.75;font:15px/1.75 Georgia,serif}.poem-page h3{font:600 15px system-ui;color:#c3ddff;margin:0 0 10px}.radio-screen{display:flex;align-items:center;justify-content:space-between;gap:8px;background:#070e11;border:2px solid #567d70;padding:10px;font:12px monospace;color:#b9f5d1}.led{width:10px;height:10px;background:#53616a;flex:none}.led.playing{background:#a0ffb2}.tracks{display:grid;gap:5px;margin:10px 0}.tracks button{text-align:left;min-height:38px}.tracks button[aria-pressed=true]{border-color:#e3efff;background:#304a70}.radio-controls{display:grid;grid-template-columns:repeat(3,1fr);gap:5px;margin-top:8px}.radio-controls button{font-size:12px;padding:5px}.zoom{display:block;width:100%;height:auto;image-rendering:pixelated;image-rendering:crisp-edges;background:#070a14;border:2px solid #3d5378}.hint-flash{animation:flash .4s steps(2,end) infinite}@keyframes flash{50%{opacity:.35}}
@media(orientation:portrait){.stage{grid-template-columns:1fr;grid-template-rows:auto auto}.inventory{grid-template-columns:32px repeat(4,minmax(0,1fr)) 32px;grid-template-rows:54px;gap:5px}.inventory button{min-height:44px}.slot img{width:28px;height:28px}#game{max-height:56svh}.dpad{margin-top:7px}.bottom{position:sticky;bottom:0;background:var(--ink);padding-bottom:env(safe-area-inset-bottom)}}
@media(orientation:landscape) and (max-height:520px){.app{width:min(100%,850px)}.stage{grid-template-columns:minmax(0,1fr) 60px}#game{max-height:calc(100svh - 95px)}.bottom{margin-top:4px}.dpad{position:fixed;right:82px;bottom:55px;background:#070a14aa;padding:3px;margin:0}}
@media(prefers-reduced-motion:reduce){.hint-flash{animation:none!important}}
</style>
</head>
<body>
<main class="app">
<header class="top"><strong>✦ CANTINHO DA MIO</strong><span id="weatherIcon" aria-hidden="true"></span></header>
<section class="stage" aria-label="Quarto explorável">
<div class="canvas-wrap"><canvas id="game" width="320" height="240" tabindex="0" aria-label="Quarto em pixel art. Toque em um objeto para caminhar até ele. Use setas ou WASD."></canvas></div>
<nav class="inventory" aria-label="Inventário"><button id="invUp" aria-label="Itens anteriores">▲</button><button class="slot" data-slot="0" aria-label="Slot de inventário 1" aria-pressed="false"></button><button class="slot" data-slot="1" aria-label="Slot de inventário 2" aria-pressed="false"></button><button class="slot" data-slot="2" aria-label="Slot de inventário 3" aria-pressed="false"></button><button class="slot" data-slot="3" aria-label="Slot de inventário 4" aria-pressed="false"></button><button id="invDown" aria-label="Próximos itens">▼</button></nav>
</section>
<nav class="bottom" aria-label="Controles"><button id="home">Home</button><button id="hint">Hint</button><button id="sound" aria-pressed="false">Sound</button><button id="pause" aria-pressed="false">Pause</button></nav>
<div class="dpad" aria-label="Movimento"><button class="up" data-move="up" aria-label="Cima">▲</button><button class="left" data-move="left" aria-label="Esquerda">◀</button><button class="down" data-move="down" aria-label="Baixo">▼</button><button class="right" data-move="right" aria-label="Direita">▶</button></div>
</main>
<div id="ytPlayer" aria-hidden="true" style="position:fixed;left:-1000px;top:0;width:1px;height:1px;overflow:hidden"></div>
<section class="panel" id="poemsPanel" hidden role="dialog" aria-modal="true" aria-label="Caderno"><div class="window"><div class="head"><h2>▤ CADERNO</h2><button class="x" data-close aria-label="Fechar">×</button></div><div class="poem-tabs" id="poemTabs"></div><article class="poem-page" id="poemPage"></article></div></section>
<section class="panel" id="radioPanel" hidden role="dialog" aria-modal="true" aria-label="Rádio"><div class="window"><div class="head"><h2>♫ RÁDIO</h2><button class="x" data-close aria-label="Fechar">×</button></div><div class="radio-screen"><span id="radioTitle">Final Duet — OMORI</span><span id="radioLed" class="led"></span></div><div class="radio-controls"><button id="prevTrack">◀</button><button id="playPause">▶ / Ⅱ</button><button id="nextTrack">▶</button></div><div class="tracks" id="trackList"></div><p><a id="youtubeLink" href="https://www.youtube.com/results?search_query=Final+Duet+OMORI" target="_blank" rel="noopener noreferrer">Abrir no YouTube ↗</a></p></div></section>
<section class="panel" id="zoomPanel" hidden role="dialog" aria-modal="true" aria-label="Objeto ampliado"><div class="window"><div class="head"><h2>✧</h2><button class="x" data-close aria-label="Fechar">×</button></div><canvas class="zoom" id="zoomCanvas" width="256" height="160"></canvas><div class="bottom"><button id="zoomAction">✧</button><button id="zoomClose" data-close>⌂ Home</button></div></div></section>
<script>
"use strict";
const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
const canvas=$("#game"),ctx=canvas.getContext("2d",{alpha:false}),W=320,H=240;
ctx.imageSmoothingEnabled=false;
const reduced=matchMedia("(prefers-reduced-motion: reduce)").matches;
const bg=new Image(),mio=new Image(),rain=new Image(),icons=new Image();
bg.src="assets/room.png";mio.src="assets/mio.png";rain.src="assets/rain.png";icons.src="assets/inventory.png";
const player={x:159,y:166,dir:0,frame:0,walk:0,speed:1.25};
const keys=new Set();let target=null,modal="",weather=0,weatherFrame=0,clock=0,paused=false,selected=null,inventory=[],invStart=0,near=null,hintTarget=null;
const objectList=[
 {id:"window",x:22,y:15,w:68,h:49,tx:55,ty:94},
 {id:"shelf",x:7,y:75,w:46,h:42,tx:57,ty:121},
 {id:"wardrobe",x:92,y:11,w:52,h:63,tx:148,ty:94},
 {id:"desk",x:66,y:76,w:55,h:45,tx:126,ty:124},
 {id:"bed",x:208,y:76,w:101,h:76,tx:199,ty:158},
 {id:"radio",x:247,y:157,w:47,h:27,tx:239,ty:184},
 {id:"notebook",x:73,y:82,w:18,h:13,tx:93,ty:130},
 {id:"floor",x:153,y:215,w:17,h:12,tx:150,ty:209}
];
const itemData={key:{label:"✦",icon:0},thread:{label:"⌁",icon:1},moon:{label:"☾",icon:2},bookmark:{label:"▤",icon:3},pencil:{label:"╱",icon:4},button:{label:"●",icon:5},cassette:{label:"♫",icon:0}};
const found=new Set(),unlocked=new Set(),used=new Set();
const poemInfo=[
 {id:1,title:"A morte do vazio",file:"morte-do-vazio.txt",item:"key"},
 {id:2,title:"O tempo / Grazie, tempo",file:"o-tempo.txt",item:"thread"},
 {id:3,title:"Eu sou o monstro que devora",file:"monstro-que-devora.txt",item:"moon"},
 {id:4,title:"O Azul Que Restou em Mim"},
 {id:5,title:"O Que Fica de Nós"},
 {id:6,title:"A Distância Que Nos Faz Perto"},
 {id:7,title:"Coração a Coração"}
];
let poemContent={};
fetch("content/poems/poems.json").then(r=>r.ok?r.json():{}).then(j=>poemContent=j).catch(()=>{});
const tracks=[
 {title:"Final Duet — OMORI",id:"8ya9EhvcNsA"},
 {title:"Blue Hair — TV Girl",id:"abW7Cr9Vo_M"},
 {title:"Great Fairy Fountain — Zelda",id:"N_2euThPYO4"},
 {title:"Stairway to Heaven — Led Zeppelin",id:"Ly6ZhQVnVow"},
 {title:"Cotidiano — Chico Buarque",id:"dHYOVuq_Fco"},
 {title:"Heart to Heart — Mac DeMarco",id:"qBoQzo98EpQ"}
];
let lastTime=0;let trackIndex=0,yt=null,ytReady=false,radioStarted=false,playing=false,muted=true,skipAfterError=false;
function playerState(){const track=tracks[trackIndex];$("#radioTitle").textContent=track.title;$("#youtubeLink").href="https://www.youtube.com/watch?v="+track.id;$("#radioLed").classList.toggle("playing",playing);$("#sound").setAttribute("aria-pressed",String(!muted&&playing));}
function loadTrack(i,autoplay=false){trackIndex=(i+tracks.length)%tracks.length;playerState();renderTracks();if(ytReady){if(autoplay)yt.loadVideoById(tracks[trackIndex].id);else yt.cueVideoById(tracks[trackIndex].id);}}
function nextTrack(){loadTrack(trackIndex+1,radioStarted&&!muted&&!paused);}
function onYouTubeIframeAPIReady(){yt=new YT.Player("ytPlayer",{width:"1",height:"1",videoId:tracks[0].id,playerVars:{playsinline:1,controls:0,rel:0,fs:0,iv_load_policy:3},events:{onReady:()=>{ytReady=true;try{yt.setVolume(35);yt.mute();}catch{}if(pendingRadioStart)startRadio();},onStateChange:e=>{playing=e.data===YT.PlayerState.PLAYING;playerState();if(e.data===YT.PlayerState.ENDED)nextTrack();},onError:()=>{playing=false;playerState();$("#radioLed").classList.remove("playing");if(radioStarted)nextTrack();}}});}
window.onYouTubeIframeAPIReady=onYouTubeIframeAPIReady;
const api=document.createElement("script");api.src="https://www.youtube.com/iframe_api";document.head.append(api);
let pendingRadioStart=false;function startRadio(){if(radioStarted)return;if(!ytReady){pendingRadioStart=true;return;}radioStarted=true;pendingRadioStart=false;muted=false;try{yt.unMute();yt.setVolume(35);yt.loadVideoById(tracks[trackIndex].id);}catch{}playerState();}
function toggleSound(){if(!ytReady){pendingRadioStart=true;muted=!muted;playerState();return;}if(!radioStarted){startRadio();return;}muted=!muted;if(muted)yt.mute();else{yt.unMute();if(!paused)yt.playVideo();}playerState();}
function renderTracks(){const list=$("#trackList");list.replaceChildren();tracks.forEach((t,i)=>{const b=document.createElement("button");b.type="button";b.textContent=t.title;b.setAttribute("aria-pressed",String(i===trackIndex));b.onclick=()=>{trackIndex=i;radioStarted=true;muted=false;paused=false;if(ytReady){yt.unMute();yt.setVolume(35);yt.loadVideoById(t.id);}playerState();renderTracks();};list.append(b);});}
function addItem(id){if(found.has(id)||inventory.includes(id))return;found.add(id);inventory.push(id);renderInventory();}
function renderInventory(){const slots=$$(".slot");slots.forEach((b,i)=>{b.replaceChildren();const id=inventory[invStart+i];b.setAttribute("aria-pressed",String(id===selected));if(id){const im=document.createElement("img");im.src="assets/inventory.png";im.alt="";im.style.objectPosition="0 0";im.style.objectFit="none";im.style.width="16px";im.style.height="16px";im.style.imageRendering="pixelated";const data=itemData[id];im.style.objectPosition=(-((data?.icon||0)%3)*16)+"px "+(-Math.floor((data?.icon||0)/3)*16)+"px";b.append(im);const label=document.createElement("span");label.textContent=data?.label||"✦";/* item art comes only from the generated PNG sprite sheet */}});}
function inventoryHas(id){return inventory.includes(id);}
function consume(id){inventory=inventory.filter(x=>x!==id);if(selected===id)selected=null;renderInventory();}
function openPanel(id){modal=id;target=null;$("#"+id).hidden=false;$("#game").blur();}
function closePanels(){if(modal)$("#"+modal).hidden=true;modal="";target=null;$("#game").focus({preventScroll:true});}
function openPoems(){openPanel("poemsPanel");renderPoems();}
function renderPoems(){const tabs=$("#poemTabs");tabs.replaceChildren();for(let i=1;i<=7;i++){const b=document.createElement("button");b.textContent=unlocked.has(i)?String(i):"·";b.setAttribute("aria-label","Página "+i);b.disabled=!unlocked.has(i);b.onclick=()=>showPoem(i);tabs.append(b);}showPoem([...unlocked].sort((a,b)=>a-b).at(-1)||1);}
async function showPoem(i){const p=poemInfo[i-1],page=$("#poemPage");$$(".poem-tabs button").forEach((b,j)=>b.setAttribute("aria-pressed",String(j===i-1)));if(!unlocked.has(i)){page.textContent="";return;}let textContent;if(p.file){try{const r=await fetch("content/poems/"+p.file);textContent=r.ok?(await r.text()).trim():"";}catch{textContent="";}if(!textContent)textContent="[texto original a inserir]";}else{textContent=poemContent[String(i)]?.text||"[texto original a inserir]";}page.replaceChildren();const h=document.createElement("h3");h.textContent=p.title;page.append(h,document.createTextNode(textContent));}
function unlock(i){if(unlocked.has(i))return;unlocked.add(i);renderPoems();if(modal==="poemsPanel")showPoem(i);}
function dist(a,b){return Math.hypot(a.x-b.x,a.y-b.y);}
function collision(x,y){if(x<8||x>312||y<91||y>232)return true;const solids=[{x:7,y:75,w:46,h:42},{x:92,y:11,w:52,h:63},{x:66,y:76,w:55,h:45},{x:208,y:76,w:101,h:76},{x:247,y:157,w:47,h:27}];return solids.some(o=>x+3>o.x&&x-3<o.x+o.w&&y+7>o.y&&y-4<o.y+o.h);}
function closestObject(x,y){return objectList.filter(o=>x>=o.x-3&&x<=o.x+o.w+3&&y>=o.y-3&&y<=o.y+o.h+3).sort((a,b)=>a.w*a.h-b.w*b.h)[0]||null;}
function interact(id){if(id==="window"){weather=1-weather;if(weather===1)addItem("moon");else openPanel("zoomPanel");return;}
 if(id==="shelf"){if(selected==="key"&&!used.has("shelfKey")){used.add("shelfKey");consume("key");addItem("bookmark");unlock(4);}else if(!found.has("key"))addItem("key");else if(!found.has("bookmark"))addItem("bookmark");else openZoom(id);return;}
 if(id==="wardrobe"){if(selected==="key"&&!used.has("wardrobeKey")){used.add("wardrobeKey");consume("key");unlock(1);addItem("thread");}else if(selected==="button"&&!used.has("wardrobeButton")){used.add("wardrobeButton");consume("button");unlock(6);}else openZoom(id);return;}
 if(id==="desk"){if(selected==="cassette"&&!used.has("deskCassette")){used.add("deskCassette");consume("cassette");unlock(7);}else if(!found.has("thread"))addItem("thread");else if(!found.has("pencil"))addItem("pencil");else openZoom(id);return;}
 if(id==="bed"){if(selected==="thread"&&!used.has("bedThread")){used.add("bedThread");consume("thread");unlock(2);}else if(selected==="button"&&!used.has("bedButton")){used.add("bedButton");consume("button");unlock(6);}else if(!found.has("button"))addItem("button");else openZoom(id);return;}
 if(id==="radio"){if(selected==="moon"&&!used.has("radioMoon")){used.add("radioMoon");consume("moon");unlock(3);addItem("cassette");}else if(selected==="bookmark"&&!used.has("radioBookmark")){used.add("radioBookmark");consume("bookmark");unlock(4);}else{openPanel("radioPanel");if(!radioStarted)startRadio();}return;}
 if(id==="notebook"){if(selected==="pencil"&&!used.has("notebookPencil")){used.add("notebookPencil");consume("pencil");unlock(5);}openPoems();return;}
 if(id==="floor"){if(!found.has("pencil"))addItem("pencil");else openZoom(id);}
}
function openZoom(id){openPanel("zoomPanel");const z=$("#zoomCanvas").getContext("2d");z.imageSmoothingEnabled=false;const o=objectList.find(x=>x.id===id)||objectList[0];z.fillStyle="#080d1a";z.fillRect(0,0,256,160);if(bg.complete)z.drawImage(bg,o.x,o.y,o.w,o.h,0,0,256,160);$("#zoomAction").onclick=()=>{if(id==="shelf"&&!found.has("bookmark"))addItem("bookmark");else if(id==="desk"&&!found.has("pencil"))addItem("pencil");else if(id==="floor"&&!found.has("pencil"))addItem("pencil");closePanels();};}
function triggerObject(id){if(id==="radio"&&!radioStarted)startRadio();interact(id);}
function moveToObject(o){if(!o)return;target={x:o.tx,y:o.ty,id:o.id};}
function draw(){ctx.imageSmoothingEnabled=false;ctx.fillStyle="#070a14";ctx.fillRect(0,0,W,H);if(bg.complete)ctx.drawImage(bg,0,0);if(weather===0&&rain.complete&&!reduced)ctx.drawImage(rain,weatherFrame*W,0,W,H,0,0,W,H);else if(weather===1){for(let i=0;i<20;i++){const x=(i*37+clock*0.08)%W,y=(i*29)%75;ctx.fillStyle=i%3?"#b9d5f6":"#d6c7ff";ctx.fillRect(x,y,1,1);}}
 // sparkle markers pulse only; no labels
 for(const o of objectList){const pulse=(Math.floor(clock/280)+o.x)%4===0;if(pulse&&!reduced){ctx.fillStyle="#d8e8ff";ctx.fillRect(o.x+o.w/2,o.y-2,2,2);ctx.fillRect(o.x+o.w/2-2,o.y,1,1);}if(hintTarget===o.id){ctx.strokeStyle="#f2d68c";ctx.lineWidth=1;ctx.strokeRect(o.x-2,o.y-2,o.w+4,o.h+4);}}
 if(mio.complete){const row=player.dir,frame=player.walk?1+Math.floor(player.frame)%2:0;ctx.drawImage(mio,frame*16,row*24,16,24,Math.round(player.x-8),Math.round(player.y-20),16,24);}
}
function step(dt){if(paused||modal)return;clock+=dt;if(!reduced)weatherFrame=Math.floor(clock/160)%4;
 let dx=0,dy=0;if(target){dx=target.x-player.x;dy=target.y-player.y;const d=Math.hypot(dx,dy);if(d<2){player.x=target.x;player.y=target.y;const id=target.id;target=null;triggerObject(id);}else{dx/=d;dy/=d;}}
 else{if(keys.has("left"))dx=-1;if(keys.has("right"))dx=1;if(keys.has("up"))dy=-1;if(keys.has("down"))dy=1;}
 near=objectList.map(o=>({o,d:Math.hypot(o.tx-player.x,o.ty-player.y)})).filter(v=>v.d<23).sort((a,b)=>a.d-b.d)[0]?.o||null;
 if(dx||dy){const mag=Math.hypot(dx,dy)||1;dx=dx/mag*player.speed*(dt/16.7);dy=dy/mag*player.speed*(dt/16.7);if(!collision(player.x+dx,player.y))player.x+=dx;if(!collision(player.x,player.y+dy))player.y+=dy;player.walk=1;player.frame+=dt/120;if(Math.abs(dx)>Math.abs(dy))player.dir=dx<0?1:2;else player.dir=dy<0?3:0;}else player.walk=0;
}
function loop(t){const dt=Math.min(40,t-lastTime||16);lastTime=t;step(dt);draw();requestAnimationFrame(loop);}
canvas.addEventListener("pointerdown",e=>{startRadio();const r=canvas.getBoundingClientRect(),x=(e.clientX-r.left)*W/r.width,y=(e.clientY-r.top)*H/r.height;const o=closestObject(x,y);if(o)moveToObject(o);else target={x:Math.max(10,Math.min(310,x)),y:Math.max(91,Math.min(232,y)),id:null};});
$$("[data-move]").forEach(b=>{const d=b.dataset.move;b.addEventListener("pointerdown",e=>{e.preventDefault();startRadio();keys.add(d);});for(const ev of ["pointerup","pointercancel","pointerleave"])b.addEventListener(ev,()=>keys.delete(d));});
window.addEventListener("keydown",e=>{const map={ArrowLeft:"left",a:"left",ArrowRight:"right",d:"right",ArrowUp:"up",w:"up",ArrowDown:"down",s:"down"};if(map[e.key]){e.preventDefault();keys.add(map[e.key]);startRadio();}if(e.key==="Escape"||e.key.toLowerCase()==="x"){closePanels();}if(e.key==="Enter"||e.key===" "){if(near)triggerObject(near.id);}});
window.addEventListener("keyup",e=>{const map={ArrowLeft:"left",a:"left",ArrowRight:"right",d:"right",ArrowUp:"up",w:"up",ArrowDown:"down",s:"down"};if(map[e.key])keys.delete(map[e.key]);});
$$(".slot").forEach(b=>b.onclick=()=>{const id=inventory[invStart+Number(b.dataset.slot)];selected=selected===id?null:id;renderInventory();});
$("#invUp").onclick=()=>{invStart=Math.max(0,invStart-1);renderInventory();};$("#invDown").onclick=()=>{invStart=Math.min(Math.max(0,inventory.length-4),invStart+1);renderInventory();};
$("#home").onclick=()=>closePanels();$("#hint").onclick=()=>{const i=[1,2,3,4,5,6,7].find(n=>!unlocked.has(n));const ids={1:"wardrobe",2:"bed",3:"radio",4:"shelf",5:"notebook",6:"wardrobe",7:"desk"};hintTarget=ids[i]||"notebook";setTimeout(()=>hintTarget=null,3000);};
$("#sound").onclick=toggleSound;$("#pause").onclick=()=>{paused=!paused;$("#pause").setAttribute("aria-pressed",String(paused));$("#pause").textContent=paused?"Play":"Pause";if(ytReady&&radioStarted){if(paused)yt.pauseVideo();else if(!muted)yt.playVideo();}};
$("#prevTrack").onclick=()=>loadTrack(trackIndex-1,radioStarted&&!muted);$("#nextTrack").onclick=nextTrack;$("#playPause").onclick=()=>{if(!radioStarted)startRadio();else if(playing)yt.pauseVideo();else{muted=false;yt.unMute();yt.playVideo();}};renderTracks();
$$("[data-close]").forEach(b=>b.onclick=closePanels);document.querySelectorAll(".panel").forEach(p=>p.addEventListener("click",e=>{if(e.target===p)closePanels();}));
renderInventory();requestAnimationFrame(loop);
</script>
</body></html>
