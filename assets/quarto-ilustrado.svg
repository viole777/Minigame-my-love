<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 1080" role="img" aria-labelledby="title desc">
<title id="title">Quarto ilustrado do Cantinho da Mio</title><desc id="desc">Quarto aconchegante à noite, com janela chuvosa, cama, estante, escrivaninha, rádio e luz quente.</desc>
<defs>
