 <linearGradient id="floor" x2="0" y2="1"><stop stop-color="#795b60"/><stop offset="1" stop-color="#392f3d"/></linearGradient>
 <linearGradient id="wood" x2="1" y2="1"><stop stop-color="#a87962"/><stop offset=".5" stop-color="#704b4b"/><stop offset="1" stop-color="#493642"/></linearGradient>
