 <linearGradient id="glass" x2="0" y2="1"><stop stop-color="#1e314d"/><stop offset=".55" stop-color="#516c85"/><stop offset="1" stop-color="#d0a6a0"/></linearGradient>
 <radialGradient id="lamp"><stop stop-color="#f6d9a4" stop-opacity=".65"/><stop offset="1" stop-color="#f6d9a4" stop-opacity="0"/></radialGradient>
