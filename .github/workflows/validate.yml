name: Validate site

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate page structure and inline JavaScript syntax
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const vm = require('node:vm');
          const assert = require('node:assert/strict');
          const html = fs.readFileSync('index.html', 'utf8');

          assert.match(html, /<!doctype html>/i, 'Missing HTML doctype');
          assert.match(html, /<html[^>]+lang="pt-BR"/i, 'Document language should be pt-BR');
          assert.match(html, /<main\b/i, 'Missing main landmark');
          assert.match(html, /prefers-reduced-motion/i, 'Reduced-motion support is expected');
          assert.match(html, /<canvas\b[^>]*id="game"/i, 'Missing low-resolution game canvas');
          assert.match(html, /image-rendering:\s*pixelated/i, 'Pixelated scaling should be enabled');
          assert.match(html, /prefers-reduced-motion/i, 'Reduced motion should be respected');
          assert.match(html, /YouTubeIframeAPIReady/i, 'Missing YouTube IFrame API integration');
          assert.match(html, /onStateChange/i, 'Missing YouTube state-change handling');
          assert.match(html, /data-move=/i, 'Missing touch D-pad controls');
          assert.match(html, /aria-modal="true"/i, 'Interactive panels should behave as dialogs');
          assert.match(html, /data-sticker=/i, 'Missing scrapbook touch controls');

          const ids = [...html.matchAll(/\bid="([^"]+)"/g)].map(match => match[1]);
          assert.equal(ids.length, new Set(ids).size, 'Duplicate HTML id found');

          const scripts = [...html.matchAll(/<script\b([^>]*)>([\s\S]*?)<\/script>/gi)];
          const inlineScripts = scripts.filter(match => !/\bsrc\s*=/.test(match[1]));
          assert.equal(inlineScripts.length, 1, 'Expected one inline application script');
          new vm.Script(inlineScripts[0][2], { filename: 'index.html:inline-script' });

          for (const id of ['game', 'radioPanel', 'ytPlayer', 'poemsPanel', 'huntersPanel', 'scrapPanel', 'booksPanel', 'dialogue', 'muteButton']) {
            assert.ok(ids.includes(id), 'Missing required element id: ' + id);
          }

          console.log('Validation passed: canvas game, unique IDs, panels, touch controls, YouTube API integration, reduced motion, and JavaScript syntax.');
          NODE
