name: Validate site

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Generate and inspect pixel-art PNG assets
        run: |
          python3 scripts/generate_assets.py
          python3 - <<'PY'
          import struct
          from pathlib import Path
          expected = {"room.png": (320,240), "mio.png": (48,96), "rain.png": (1280,240), "inventory.png": (48,32)}
          for name, size in expected.items():
              p = Path("assets") / name
              data = p.read_bytes()
              assert data[:8] == b"\x89PNG\r\n\x1a\n", f"{name} is not a PNG"
              dims = struct.unpack(">II", data[16:24])
              assert dims == size, f"{name}: expected {size}, got {dims}"
          print("PNG assets valid:", ", ".join(expected))
          PY
      - name: Validate HTML and JavaScript syntax
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const vm = require('node:vm');
          const assert = require('node:assert/strict');
          const html = fs.readFileSync('index.html', 'utf8');
          assert.match(html, /<canvas[^>]*width="320"[^>]*height="240"/i, 'Canvas must be 320x240');
          assert.match(html, /image-rendering:\s*pixelated/i, 'Pixel scaling missing');
          assert.match(html, /assets\/room\.png/, 'Room PNG must be loaded');
          assert.match(html, /assets\/mio\.png/, 'Character PNG must be loaded');
          assert.match(html, /YouTubeIframeAPIReady/, 'YouTube API callback missing');
          assert.match(html, /YT\.PlayerState\.ENDED/, 'Playlist must advance on ENDED');
          assert.match(html, /onError/, 'YouTube errors must be handled');
          assert.match(html, /prefers-reduced-motion/, 'Reduced motion support missing');
          assert.match(html, /id="joystick"/, 'Touch joystick missing');
          assert.doesNotMatch(html, /<svg\b|background-image:\s*linear-gradient/i, 'Scene must not use vector SVG or CSS gradients');
          const ids = [...html.matchAll(/\bid="([^"]+)"/g)].map(m => m[1]);
          assert.equal(ids.length, new Set(ids).size, 'Duplicate HTML id');
          const scripts = [...html.matchAll(/<script\b([^>]*)>([\s\S]*?)<\/script>/gi)].filter(m => !/\bsrc\s*=/.test(m[1]));
          assert.equal(scripts.length, 1, 'Expected one application script');
          new vm.Script(scripts[0][2], {filename:'index.html:inline-script'});
          const poems = JSON.parse(fs.readFileSync('content/poems/poems.json','utf8'));
          assert.deepEqual(Object.keys(poems).sort(), ['4','5','6','7']);
          for (const file of ['morte-do-vazio.txt','o-tempo.txt','monstro-que-devora.txt']) assert.ok(fs.existsSync('content/poems/'+file));
          console.log('HTML, JS syntax, poem separation and asset generation checks passed.');
          NODE
