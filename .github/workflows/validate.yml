name: Validate site

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate HTML, JavaScript, puzzle controls and playlist
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const vm = require('node:vm');
          const assert = require('node:assert/strict');
          const html = fs.readFileSync('index.html', 'utf8');
          assert.match(html, /data-o="window"/, 'Window hotspot missing');
          assert.match(html, /data-o="dresser"/, 'Dresser hotspot missing');
          assert.match(html, /data-o="bed"/, 'Bed hotspot missing');
          assert.match(html, /id="inventory"/, 'Inventory missing');
          assert.match(html, /id="poemsPanel"/, 'Poem notebook missing');
          assert.match(html, /id="radioPanel"/, 'Radio missing');
          assert.doesNotMatch(html, /joystick|pixelated|assets\/mio\.png|assets\/room\.png/i, 'Old character movement or pixel-art scene remains');
          assert.match(html, /YT\.PlayerState\.ENDED/, 'Playlist must advance on ENDED');
          assert.match(html, /onError/, 'YouTube errors must be handled');
          const ids = [...html.matchAll(/\bid="([^"]+)"/g)].map(m => m[1]);
          assert.equal(ids.length, new Set(ids).size, 'Duplicate HTML id');
          const scripts = [...html.matchAll(/<script\b([^>]*)>([\s\S]*?)<\/script>/gi)].filter(m => !/\bsrc\s*=/.test(m[1]));
          assert.equal(scripts.length, 1, 'Expected one application script');
          new vm.Script(scripts[0][2], {filename:'index.html:inline-script'});
          const playlist = [...html.matchAll(/title:"([^"]+)"/g)].map(m => m[1]);
          assert.deepEqual(playlist, ['Final Duet — OMORI','Blue Hair — TV Girl','Great Fairy Fountain — Zelda','Stairway to Heaven — Led Zeppelin','Cotidiano — Chico Buarque','Heart to Heart — Mac DeMarco']);
          const musicMd = fs.readFileSync('MUSICAS.md','utf8');
          for (const title of playlist) assert.ok(musicMd.includes(title), 'Missing song in MUSICAS.md: '+title);
          const poems = JSON.parse(fs.readFileSync('content/poems/poems.json','utf8'));
          assert.deepEqual(Object.keys(poems).sort(), ['4','5','6','7']);
          console.log('HTML, JS syntax, point-and-click controls, six-song playlist and poems passed.');
          NODE
