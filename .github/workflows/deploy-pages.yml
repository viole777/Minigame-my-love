name: Deploy site to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Download Kenney CC0 indoor sprites
        run: |
          mkdir -p assets/kenney-indoor
          curl -L --fail --retry 3 "https://opengameart.org/sites/default/files/Roguelike%20Indoor%20pack.zip" -o /tmp/kenney-indoor.zip
          unzip -o /tmp/kenney-indoor.zip -d assets/kenney-indoor
          find assets/kenney-indoor -maxdepth 2 -type f
      - name: Generate remaining game PNG assets
        run: python3 scripts/generate_assets.py

      - name: Upload static site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
